<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>股價趨勢 - kuguge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>

    <!-- 共用會員 JavaScript -->
    <script src="auth.js"></script>

</head>


<body>


<h2 id="stockTitle">
    查詢中...
</h2>


<!-- ======================================== -->
<!-- K線圖區域 -->
<!-- ======================================== -->

<div id="chartContainer"></div>


<!-- ======================================== -->
<!-- 歷史股價表格 -->
<!-- ======================================== -->

<pre id="result">
    查詢中...
</pre>


<script>


    // ========================================
    // 歷史股價查詢
    // ========================================

    async function loadHistory() {


        // ====================================
        // 取得 HTML 元素
        // ====================================

        const result =
            document.getElementById("result");


        const stockTitle =
            document.getElementById("stockTitle");


        const chartContainer =
            document.getElementById("chartContainer");


        // ====================================
        // 取得網址 Query Parameter
        // ====================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        // ====================================
        // 取得 ?keyword= 後面的值
        // ====================================

        const keyword =
            params.get("keyword");


        // ====================================
        // 如果網址沒有 keyword
        // ====================================

        if (!keyword) {

            stockTitle.textContent =
                "查無相關證券資訊";


            result.textContent =
                "網址缺少 keyword 查詢參數";


            return;

        }


        result.textContent =
            "查詢中...";


        // ========================================
        // 第 1 層：確認是否有 Token
        // ========================================

        const token =
            getToken();


        if (!token) {


            stockTitle.textContent =
                "需要登入會員";


            result.textContent =
                "請先登入會員，才能使用歷史股價查詢功能";


            const goLogin =
                confirm(
                    "請先登入會員，才能使用歷史股價查詢功能。\n\n是否前往登入頁面？"
                );


            if (goLogin) {

                window.location.href =
                    "login.html";

            }


            return;

        }


        // ========================================
        // 第 2 層：
        // 確認 Token 是否仍然有效
        // ========================================

        try {


            await getCurrentUser();


        }

        catch (error) {


            stockTitle.textContent =
                "登入狀態已失效";


            result.textContent =
                "登入狀態已失效，請重新登入會員";


            const goLogin =
                confirm(
                    "登入狀態已失效，請重新登入會員。\n\n是否前往登入頁面？"
                );


            if (goLogin) {

                window.location.href =
                    "login.html";

            }


            return;

        }


        // ========================================
        // 第 3 層：
        // 呼叫 FastAPI
        // ========================================

        try {

            // 本機開發
            //const response = await fetch(
            //    `http://127.0.0.1:8000/stocks/history?keyword=${encodeURIComponent(keyword)}`,
            //    {
            //        headers: {
            //            "Authorization": `Bearer ${token}`
            //        }
            //    }
            //);

            // ====================================
            // 正式網站 API
            // ====================================

            const response =
                await fetch(
                    `https://kuguge.com/stocks/history?keyword=${encodeURIComponent(keyword)}`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            // ====================================
            // 將回應轉成 JSON
            // ====================================

            const data =
                await response.json();


            console.log(
                "API 回應：",
                data
            );


            // ====================================
            // HTTP 回應不是成功狀態
            // ====================================

            if (!response.ok) {


                // ==================================
                // 401：
                // Token 無效 / 尚未登入
                // ==================================

                if (response.status === 401) {


                    stockTitle.textContent =
                        "登入狀態已失效";


                    result.textContent =
                        data.detail
                        || "登入狀態已失效，請重新登入會員";


                    const goLogin =
                        confirm(
                            "登入狀態已失效，請重新登入會員。\n\n是否前往登入頁面？"
                        );


                    if (goLogin) {

                        window.location.href =
                            "login.html";

                    }


                    return;

                }


                // ==================================
                // 403：
                // 會員沒有此功能權限
                // ==================================

                if (response.status === 403) {


                    stockTitle.textContent =
                        "目前會員無此功能權限";


                    result.textContent =
                        data.detail
                        || "目前會員等級沒有使用歷史股價查詢功能的權限";


                    return;

                }


                // ==================================
                // 404：
                // 找不到股票
                // ==================================

                if (response.status === 404) {


                    stockTitle.textContent =
                        "查無證券資料";


                    result.textContent =
                        data.detail
                        || "沒有證券資料";


                    return;

                }


                // ==================================
                // 其他錯誤
                // ==================================

                result.textContent =
                    `錯誤 ${response.status}\n\n` +
                    (
                        data.detail
                        || "後端 API 發生錯誤"
                    );


                return;

            }


            // ========================================
            // 第 4 層：
            // API 成功
            // ========================================

            // ====================================
            // 取得證券名稱與證券代號
            // ====================================

            const stock =
                data["股票"];


            const stockCode =
                stock["證券代號"];


            const stockName =
                stock["證券名稱"];


            // ====================================
            // 個股標題
            // ====================================

            stockTitle.textContent =
                `${stockName}(${stockCode})-股價趨勢`;


            // ====================================
            // 設定瀏覽器分頁標題
            // ====================================

            document.title =
                `${stockName}(${stockCode}) - 股價趨勢 - kuguge`;


            // ====================================
            // 取得歷史資料
            // ====================================

            const history =
                data["資料"];


            // ====================================
            // 沒有歷史資料
            // ====================================

            if (
                !history
                || history.length === 0
            ) {

                result.textContent =
                    "查無歷史股價資料";


                return;

            }


            // ==================================================
            // TradingView Lightweight Charts 開始
            // ==================================================


            // =====================================
            // 建立 K 線圖
            // =====================================

            chartContainer.innerHTML = "";


            const chart =
                LightweightCharts.createChart(
                    chartContainer,
                    {

                        width:
                            chartContainer.clientWidth,

                        height:
                            500,


                        layout: {

                            background: {
                                color: "#ffffff"
                            },

                            textColor:
                                "#333333"

                        },


                        grid: {

                            vertLines: {
                                color: "#eeeeee"
                            },

                            horzLines: {
                                color: "#eeeeee"
                            }

                        },


                        crosshair: {

                            mode:
                                LightweightCharts
                                    .CrosshairMode
                                    .Normal

                        },


                        rightPriceScale: {

                            borderColor:
                                "#cccccc"

                        },


                        timeScale: {

                            borderColor:
                                "#cccccc",

                            timeVisible:
                                true,

                            secondsVisible:
                                false

                        }

                    }
                );


            // =====================================
            // 建立 K 線 Series
            // =====================================

            const candlestickSeries =
                chart.addSeries(
                    LightweightCharts.CandlestickSeries,
                    {

                        upColor:
                            "#ef5350",

                        downColor:
                            "#26a69a",

                        borderUpColor:
                            "#ef5350",

                        borderDownColor:
                            "#26a69a",

                        wickUpColor:
                            "#ef5350",

                        wickDownColor:
                            "#26a69a"

                    }
                );


            // =====================================
            // 建立成交量 Series
            // =====================================

            const volumeSeries =
                chart.addSeries(
                    LightweightCharts.HistogramSeries,
                    {

                        priceFormat: {
                            type: "volume"
                        },

                        priceScaleId: ""

                    }
                );


            // =====================================
            // 設定成交量顯示在下方
            // =====================================

            volumeSeries
                .priceScale()
                .applyOptions({

                    scaleMargins: {

                        top:
                            0.8,

                        bottom:
                            0

                    }

                });


            // =====================================
            // 設定 K 線比例
            // =====================================

            candlestickSeries
                .priceScale()
                .applyOptions({

                    scaleMargins: {

                        top:
                            0.1,

                        bottom:
                            0.25

                    }

                });


            // =====================================
            // 將 API 資料轉成 K 線格式
            // =====================================

            const candleData = [];


            const volumeData = [];


            // =====================================
            // 處理歷史資料
            // =====================================

            for (const row of history) {


                // =================================
                // 缺少 OHLC 資料時跳過
                // =================================

                if (

                    !row["交易日期"]

                    ||

                    row["開盤價"] == null

                    ||

                    row["最高價"] == null

                    ||

                    row["最低價"] == null

                    ||

                    row["收盤價"] == null

                ) {

                    continue;

                }


                // =================================
                // Lightweight Charts 日期格式
                //
                // YYYY-MM-DD
                // =================================

                const tradeDate =
                    String(
                        row["交易日期"]
                    ).substring(0, 10);


                // =================================
                // 取得 OHLC
                // =================================

                const open =
                    Number(
                        row["開盤價"]
                    );


                const high =
                    Number(
                        row["最高價"]
                    );


                const low =
                    Number(
                        row["最低價"]
                    );


                const close =
                    Number(
                        row["收盤價"]
                    );


                // =================================
                // K 線資料
                // =================================

                candleData.push({

                    time:
                        tradeDate,

                    open:
                        open,

                    high:
                        high,

                    low:
                        low,

                    close:
                        close

                });


                // =================================
                // 成交量資料
                // =================================

                if (
                    row["成交股數"] != null
                ) {


                    let color;


                    if (
                        close >= open
                    ) {

                        color =
                            "#ef535088";

                    }

                    else {

                        color =
                            "#26a69a88";

                    }


                    volumeData.push({

                        time:
                            tradeDate,

                        value:
                            Number(
                                row["成交股數"]
                            ),

                        color:
                            color

                    });

                }

            }


            // =====================================
            // K 線資料排序
            // =====================================

            candleData.sort(
                (a, b) => {

                    return a.time.localeCompare(
                        b.time
                    );

                }
            );


            // =====================================
            // 成交量資料排序
            // =====================================

            volumeData.sort(
                (a, b) => {

                    return a.time.localeCompare(
                        b.time
                    );

                }
            );


            // =====================================
            // 設定 K 線資料
            // =====================================

            candlestickSeries.setData(
                candleData
            );


            // =====================================
            // 設定成交量資料
            // =====================================

            volumeSeries.setData(
                volumeData
            );


            // =====================================
            // 自動調整圖表顯示範圍
            // =====================================

            chart
                .timeScale()
                .fitContent();


            // =====================================
            // 視窗大小改變
            // 調整圖表寬度
            // =====================================

            window.addEventListener(
                "resize",
                () => {

                    chart.applyOptions({

                        width:
                            chartContainer.clientWidth

                    });

                }
            );


            // ==================================================
            // TradingView Lightweight Charts 結束
            // ==================================================


            // =====================================
            // 建立歷史股價表格
            // =====================================

            let tableHTML = `

                <table>

                    <thead>

                        <tr>

                            <th>交易日期</th>

                            <th>開盤價</th>

                            <th>最高價</th>

                            <th>最低價</th>

                            <th>收盤價</th>

                            <th>成交金額</th>

                            <th>成交股數</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            // =====================================
            // 建立表格資料
            // =====================================

            for (const row of history) {


                // =================================
                // 交易日期格式轉換
                // YYYY-MM-DD
                // ↓
                // YYYY/MM/DD
                // =================================

                let tradeDate = "";


                if (
                    row["交易日期"]
                ) {

                    tradeDate =
                        row["交易日期"]
                            .replace(
                                /-/g,
                                "/"
                            );

                }


                // =================================
                // 成交金額千分位格式
                // =================================

                let transactionAmount =
                    "";


                if (
                    row["成交金額"] != null
                ) {

                    transactionAmount =
                        Number(
                            row["成交金額"]
                        ).toLocaleString(
                            "en-US"
                        );

                }


                // =================================
                // 成交股數千分位格式
                // =================================

                let tradingVolume =
                    "";


                if (
                    row["成交股數"] != null
                ) {

                    tradingVolume =
                        Number(
                            row["成交股數"]
                        ).toLocaleString(
                            "en-US"
                        );

                }


                // =================================
                // 加入表格列
                // =================================

                tableHTML += `

                    <tr>

                        <td>
                            ${tradeDate}
                        </td>

                        <td>
                            ${row["開盤價"] ?? ""}
                        </td>

                        <td>
                            ${row["最高價"] ?? ""}
                        </td>

                        <td>
                            ${row["最低價"] ?? ""}
                        </td>

                        <td>
                            ${row["收盤價"] ?? ""}
                        </td>

                        <td>
                            ${transactionAmount}
                        </td>

                        <td>
                            ${tradingVolume}
                        </td>

                    </tr>

                `;

            }


            // =====================================
            // 完成表格
            // =====================================

            tableHTML += `

                    </tbody>

                </table>

            `;


            // =====================================
            // 將表格顯示到網頁
            // =====================================

            result.innerHTML =
                tableHTML;


        }


        catch (error) {


            // ====================================
            // JavaScript / Fetch 發生錯誤
            // ====================================

            console.error(
                "Fetch Error:",
                error
            );


            stockTitle.textContent =
                "查詢發生錯誤";


            result.textContent =
                "無法連接後端 API\n\n" +
                `錯誤訊息：${error.message}`;


        }

    }


    // ========================================
    // 網頁載入完成後
    // 自動執行查詢
    // ========================================

    loadHistory();


</script>


</body>

</html>
