<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>會員登入 - kuguge</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div class="auth-container">


        <h1>
            會員登入
        </h1>


        <!-- ======================================== -->
        <!-- 登入表單 -->
        <!-- ======================================== -->

        <form id="loginForm">


            <!-- ==================================== -->
            <!-- Email -->
            <!-- ==================================== -->

            <div class="form-group">


                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="請輸入 Email"
                    required
                >


            </div>


            <!-- ==================================== -->
            <!-- 密碼 -->
            <!-- ==================================== -->

            <div class="form-group">


                <label for="password">
                    密碼
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="請輸入密碼"
                    required
                >


            </div>


            <!-- ==================================== -->
            <!-- 登入按鈕 -->
            <!-- ==================================== -->

            <button
                type="submit"
                id="loginButton"
            >
                登入
            </button>


        </form>


        <!-- ======================================== -->
        <!-- 登入訊息 -->
        <!-- ======================================== -->

        <p id="loginMessage"></p>


        <!-- ======================================== -->
        <!-- 註冊連結 -->
        <!-- ======================================== -->

        <p class="auth-link">

            還沒有帳號？

            <a href="register.html">
                立即註冊
            </a>

        </p>


        <!-- ======================================== -->
        <!-- 首頁連結 -->
        <!-- ======================================== -->

        <p class="auth-link">

            <a href="index.html">
                返回首頁
            </a>

        </p>


    </div>


    <!-- ======================================== -->
    <!-- 載入共用會員 JavaScript -->
    <!-- ======================================== -->

    <script src="auth.js"></script>


    <script>


        // ========================================
        // 取得登入表單
        // ========================================

        const loginForm =
            document.getElementById("loginForm");


        // ========================================
        // 取得訊息顯示區域
        // ========================================

        const loginMessage =
            document.getElementById("loginMessage");


        // ========================================
        // 取得登入按鈕
        // ========================================

        const loginButton =
            document.getElementById("loginButton");


        // ========================================
        // 監聽表單送出事件
        // ========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {


                // ====================================
                // 阻止表單預設重新整理頁面
                // ====================================

                event.preventDefault();


                // ====================================
                // 取得 Email
                // ====================================

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                // ====================================
                // 取得密碼
                // ====================================

                const password =
                    document
                        .getElementById("password")
                        .value;


                // ====================================
                // 顯示登入中
                // ====================================

                loginMessage.textContent =
                    "登入中...";


                // ====================================
                // 暫時停用登入按鈕
                //
                // 避免使用者連續點擊造成
                // 多次登入請求
                // ====================================

                loginButton.disabled =
                    true;


                try {


                    // ==================================
                    // 呼叫 auth.js 的登入函式
                    // ==================================

                    const data =
                        await loginUser(
                            email,
                            password
                        );


                    // ==================================
                    // 檢查後端是否有回傳 Token
                    // ==================================

                    if (!data.token) {

                        throw new Error(
                            "登入成功，但沒有取得登入 Token"
                        );

                    }


                    // ==================================
                    // 將 Token 儲存到瀏覽器
                    // ==================================

                    saveToken(
                        data.token
                    );


                    // ==================================
                    // 儲存會員資料
                    //
                    // 注意：
                    // 這些資料只是提供前端顯示使用。
                    //
                    // 真正權限仍由後端資料庫判斷。
                    // ==================================

                    if (data.user) {


                        localStorage.setItem(
                            "user",
                            JSON.stringify(
                                data.user
                            )
                        );

                    }


                    // ==================================
                    // 顯示登入成功
                    // ==================================

                    loginMessage.textContent =
                        `登入成功，歡迎回來 ${data.user?.nickname || ""}`;


                    // ==================================
                    // 延遲後導向會員頁面
                    // ==================================

                    setTimeout(
                        function() {

                            window.location.href =
                                "member.html";

                        },
                        500
                    );


                }


                catch (error) {


                    // ==================================
                    // 顯示登入錯誤
                    // ==================================

                    loginMessage.textContent =
                        error.message;


                    // ==================================
                    // 登入失敗
                    // 恢復登入按鈕
                    // ==================================

                    loginButton.disabled =
                        false;

                }

            }
        );


    </script>


</body>

</html>
