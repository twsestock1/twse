<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台灣證券查詢系統</title>

<style>

body{
    margin:0;
    padding:40px;
    background:#f5f6fa;
    font-family:"Microsoft JhengHei",Arial,sans-serif;
}

.container{

    max-width:1000px;
    margin:auto;
}

h1{

    text-align:center;
    color:#333;
}

.search{

    display:flex;
    gap:10px;
    margin:30px 0;
}

input{

    flex:1;
    padding:12px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{

    width:120px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{

    background:#0052a3;
}

table{

    width:100%;
    border-collapse:collapse;
    background:white;
}

th{

    background:#0066cc;
    color:white;
}

th,td{

    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){

    background:#f8f8f8;
}

#message{

    margin-bottom:15px;
    color:#666;
}

.loading{

    color:#0066cc;
}

.error{

    color:red;
}

.success{

    color:green;
}

</style>

</head>

<body>

<div class="container">

<h1>台灣證券查詢系統</h1>

<div class="search">

<input
id="keyword"
type="text"
placeholder="請輸入證券代號或證券名稱，例如：2330、台積電">

<button id="searchBtn">

查詢

</button>

</div>

<div id="message"></div>

<table>

<thead>

<tr>

<th>證券代號</th>
<th>證券名稱</th>
<th>市場別</th>
<th>有價證券別</th>
<th>產業別</th>
<th>上市日期</th>

</tr>

</thead>

<tbody id="resultBody">

<tr>

<td colspan="6">

請輸入查詢條件

</td>

</tr>

</tbody>

</table>

</div>

<script>

const API="/api";

const keyword=document.getElementById("keyword");

const button=document.getElementById("searchBtn");

const tbody=document.getElementById("resultBody");

const message=document.getElementById("message");


async function searchStock(){

    const q=keyword.value.trim();

    if(q===""){

        alert("請輸入證券代號或證券名稱");

        keyword.focus();

        return;

    }

    message.className="loading";

    message.textContent="查詢中...";

    tbody.innerHTML="";

    try{

        const response = await fetch(
            `/api/stocks?keyword=${encodeURIComponent(q)}`
            );

        if(!response.ok){

            throw new Error("HTTP "+response.status);

        }

        const result=await response.json();

        if(result.status==="failed"){

            throw new Error(result.error);

        }

        if(result.count===0){

            message.className="";

            message.textContent="";

            tbody.innerHTML=`
                <tr>
                    <td colspan="6">
                        查無符合資料
                    </td>
                </tr>
            `;

            return;

        }

        message.className="success";

        message.textContent=`共找到 ${result.count} 筆資料`;

        result.data.forEach(stock=>{

            tbody.innerHTML+=`

            <tr>

                <td>${stock.stock_code}</td>

                <td>${stock.stock_name}</td>

                <td>${stock.market}</td>

                <td>${stock.security_type}</td>

                <td>${stock.industry ?? ""}</td>

                <td>${stock.listed_date ?? ""}</td>

            </tr>

            `;

        });

    }

    catch(err){

        console.error(err);

        message.className="error";

        message.textContent="查詢失敗";

        tbody.innerHTML=`

            <tr>

                <td colspan="6">

                ${err.message}

                </td>

            </tr>

        `;

    }

}

button.addEventListener("click",searchStock);

keyword.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        searchStock();

    }

});

</script>

</body>

</html>
