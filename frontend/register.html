<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>會員註冊 - kuguge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <h1>會員註冊</h1>


    <form id="registerForm">

        <div class="form-group">

            <label for="username">
                使用者名稱
            </label>

            <input
                type="text"
                id="username"
                name="username"
                maxlength="10"
                required
            >

        </div>


        <div class="form-group">

            <label for="nickname">
                暱稱
            </label>

            <input
                type="text"
                id="nickname"
                name="nickname"
                maxlength="10"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                maxlength="50"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                密碼
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >

            <small>
                密碼至少 8 個字元
            </small>

        </div>


        <div class="form-group">

            <label for="phone">
                手機號碼（選填）
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                maxlength="10"
            >

        </div>


        <button
            type="submit"
            id="registerButton"
        >
            註冊
        </button>

    </form>


    <p id="registerMessage"></p>


    <p class="auth-link">

        已經有帳號？

        <a href="login.html">
            返回登入
        </a>

    </p>


    <p class="auth-link">

        <a href="index.html">
            返回首頁
        </a>

    </p>

</div>


<script src="auth.js"></script>


<script>

    // =====================================
    // 取得註冊表單
    // =====================================

    const registerForm =
        document.getElementById("registerForm");


    // =====================================
    // 取得訊息顯示區域
    // =====================================

    const registerMessage =
        document.getElementById("registerMessage");


    // =====================================
    // 取得註冊按鈕
    // =====================================

    const registerButton =
        document.getElementById("registerButton");


    // =====================================
    // 監聽註冊表單送出事件
    // =====================================

    registerForm.addEventListener(
        "submit",
        async function(event) {

            // 阻止表單預設重新整理
            event.preventDefault();


            // =====================================
            // 取得表單資料
            // =====================================

            const username =
                document.getElementById("username").value.trim();


            const nickname =
                document.getElementById("nickname").value.trim();


            const email =
                document.getElementById("email").value.trim();


            const password =
                document.getElementById("password").value;


            const phone =
                document.getElementById("phone").value.trim();


            // =====================================
            // 顯示註冊中
            // =====================================

            registerMessage.textContent =
                "註冊中...";


            // 暫時停用註冊按鈕
            registerButton.disabled = true;


            try {

                // =====================================
                // 呼叫註冊 API
                // =====================================

                const data = await registerUser(
                    username,
                    nickname,
                    email,
                    password,
                    phone
                );


                // =====================================
                // 顯示註冊成功訊息
                // =====================================

                registerMessage.textContent =
                    data.message + "，即將前往登入頁面";


                // =====================================
                // 註冊成功後導向登入頁面
                // =====================================

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1000
                );

            }

            catch (error) {

                // =====================================
                // 顯示錯誤訊息
                // =====================================

                registerMessage.textContent =
                    error.message;


                // 註冊失敗後重新啟用按鈕
                registerButton.disabled = false;

            }

        }
    );

</script>

</body>

</html>
